<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EL POLLO LOCO</title>

        <link rel="shortcut icon" href="./assets/img/favicon.png" type="image/x-icon" />

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <script type="module" src="js/game.js"></script>
    </head>
    <body>
        <main>
            <h1>El Pollo Loco</h1>
            <div class="rotate-hint">
                <img src="./assets/icons/rotate.svg" alt="rotate device icon" />
                <p>Please rotate your device to widescreen</p>
            </div>
            <section class="canvas">
                <canvas class="d_none" id="canvas" width="720" height="480"></canvas>
                <div class="mute-button-container">
                    <button id="mute-button" class="mute-button">
                        <img id="unmute" class="unmute d_none" src="./assets/icons/unmute.svg" alt="unmute icon" />
                        <img id="mute" class="mute" src="./assets/icons/mute.svg" alt="mute icon" />
                    </button>
                </div>
                <div id="moves" class="move-button-container d_none">
                    <button id="btnLeft" class="control">
                        <img src="./assets/icons/left.svg" alt="move left arrow" />
                    </button>
                    <button id="btnRight" class="control">
                        <img src="./assets/icons/right.svg" alt="move right arrow" />
                    </button>
                </div>
                <div id="actions" class="action-button-container d_none">
                    <button id="btnJump" class="control">
                        <img src="./assets/icons/jump.svg" alt="move jump arrow" />
                    </button>
                    <button id="btnAttack" class="control">
                        <img src="./assets/icons/attack.svg" alt="attack button" />
                    </button>
                </div>
                <div id="start" class="start-screen">
                    <img src="./assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="startscreen image" />
                </div>
                <div id="start-menu" class="start-button">
                    <button id="home" class="menu-button d_none">
                        <img src="./assets/icons/home.svg" alt="home icon" />
                    </button>
                    <a id="imprint" class="menu-button" href="./pages/imprint.html"
                        ><img src="./assets/icons/imprint.svg" alt="imprint icon" />
                    </a>
                    <button id="play"><img src="./assets/icons/play2.svg" alt="start icon" /></button>
                    <button id="controls" class="menu-button">
                        <img src="./assets/icons/settings.svg" alt="settings icon" />
                    </button>
                </div>
                <div id="won" class="you-won d_none">
                    <img src="./assets/img/You won, you lost/You Won B.png" alt="you-won image" />
                </div>
                <div id="lost" class="you-lost d_none">
                    <img src="./assets/img/You won, you lost/Game over A.png" alt="you-lost image" />
                </div>
                <dialog id="settings" class="settings"></dialog>
                <div id="overlay" class="overlay d_none"></div>
            </section>
        </main>
    </body>
</html>
